<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soof Studio — SVG Engine</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<!-- ═══════════════ TOPBAR ═══════════════ -->
<header id="topbar">
  <div id="brand">
    <span class="brand-icon">◇</span>
    <span class="brand-name">Soof Studio</span>
  </div>
  <div id="font-controls" style="display: flex; gap: 4px; margin-left: 20px;">
    <button id="btn-font-dec" class="font-btn" style="padding: 4px 8px; font-weight: bold;">A-</button>
    <button id="btn-font-inc" class="font-btn" style="padding: 4px 8px; font-weight: bold;">A+</button>
  </div>
  <nav id="mode-nav">
    <button class="mode-btn active" data-mode="LEARN" id="btn-learn">
      <span class="mode-icon">L</span> Learn
    </button>
    <button class="mode-btn" data-mode="PRACTICE" id="btn-practice">
      <span class="mode-icon">P</span> Practice
    </button>
    <button class="mode-btn" data-mode="FREE" id="btn-free">
      <span class="mode-icon">S</span> Sandbox
    </button>
  </nav>

  <!-- Feature 1: Flip button -->
  <button class="font-btn" id="btn-flip" title="Toggle between working reverse side and finished front face">
    ↪ Finished
  </button>

  <div id="thread-counter">
    <span class="counter-label">Cursor</span>
    <span id="coord-display" class="counter-val">Warp 0 Weft 0</span>
  </div>
</header>

<!-- ═══════════════ APP BODY ═══════════════ -->
<div id="app-body">
  <!-- LEFT PANEL -->
  <aside id="left-panel">
    <div id="left-panel-content"></div>
  </aside>

  <!-- WORKSPACE -->
  <main id="workspace">
    <!-- SVG Container for Grid & Stitches -->
    <div id="svg-container">
      <!-- Pixel-level embroidery canvas (behind SVG) -->
      <canvas id="stitch-canvas"></canvas>

      <svg id="canvas-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 3D Cylindrical Thread Filter (specular lighting + displacement for organic texture) -->
          <filter id="thread-texture" x="-20%" y="-20%" width="140%" height="140%">
            <!-- Create noise to displacement map the edges for fiber realism -->
            <feTurbulence type="fractalNoise" baseFrequency="0.5 0.1" numOctaves="2" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
            
            <!-- Generate 3D specular highlight along the thread cylinder -->
            <feSpecularLighting in="displaced" specularExponent="16" lighting-color="#ffffff" surfaceScale="1.5" result="light">
              <feDistantLight azimuth="225" elevation="50" />
            </feSpecularLighting>
            
            <!-- Combine the lighting highlight with the original color -->
            <feComposite in="displaced" in2="light" operator="arithmetic" k1="0.5" k2="0.85" k3="0.6" k4="0" result="litStitch"/>
            
            <!-- Subtle drop shadow under the 3D thread -->
            <feDropShadow dx="0.6" dy="1.2" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.38"/>
          </filter>

          <!-- Original shadow for overlays -->
          <filter id="thread-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-opacity="0.3"/>
          </filter>

          <!-- Feature 3: Fabric texture for woven linen look -->
          <filter id="fabric-texture" x="0%" y="0%" width="100%" height="100%">
            <!-- 1. Generate procedural fiber noise -->
            <feTurbulence type="fractalNoise" baseFrequency="0.08 0.08" numOctaves="4" result="noise" />
            
            <!-- 2. Woven fabric structure kernel -->
            <feConvolveMatrix order="3" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0" in="noise" result="woven" />
            
            <!-- 3. Add 3D diffuse lighting to simulate thread bumps -->
            <feDiffuseLighting in="woven" surfaceScale="1.2" lighting-color="#ffffff" result="light">
              <feDistantLight azimuth="225" elevation="65" />
            </feDiffuseLighting>
            
            <!-- 4. Blend onto the background fabric color -->
            <feBlend mode="multiply" in="SourceGraphic" in2="light" />
          </filter>
        </defs>

        <!-- Groups for z-ordering -->
        <g id="layer-fabric"></g>   <!-- Feature 3: woven linen threads -->
        <g id="layer-grid"></g>     <!-- intersection dots (needle points) -->
        <g id="layer-ghost"></g>
        <g id="layer-floats"></g>   <!-- Feature 4: float/jump threads on reverse -->
        <g id="layer-stitches"></g>
        <g id="layer-overlay"></g>
      </svg>

      <!-- Needle Cursor Element -->
      <div id="needle-cursor">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L12 22" stroke="#2C2C2C" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="12" cy="5" r="1.5" stroke="#2C2C2C" stroke-width="1"/>
          <path d="M9 16L12 22L15 16" fill="#C0392B"/>
        </svg>
      </div>

      <!-- Radial Selector Popover -->
      <div id="radial-popover" class="hidden">
        <div class="radial-title" id="radial-prompt">Warp Threads?</div>
        <div class="radial-grid">
          <button class="num-btn">1</button>
          <button class="num-btn">2</button>
          <button class="num-btn">3</button>
          <button class="num-btn">4</button>
          <button class="num-btn">5</button>
          <button class="num-btn">6</button>
          <button class="num-btn">7</button>
          <button class="num-btn">8</button>
          <button class="num-btn">9</button>
        </div>
        <button class="num-btn zero-btn">0</button>
      </div>

      <!-- Feature 4: Bulk / Thread Budget Meter (shown on reverse face) -->
      <div id="bulk-meter">
        <div id="bulk-meter-track">
          <div id="bulk-bar"></div>
        </div>
        <span id="bulk-label">Place stitches to measure thread budget</span>
      </div>
    </div>
  </main>

  <!-- RIGHT PANEL -->
  <aside id="right-panel">
    <div id="right-panel-content"></div>
  </aside>
</div>

<!-- ═══════════════ SCRIPTS ═══════════════ -->
<script src="js/motifs.js?v=5"></script>
<script src="js/engine.js?v=5"></script>
<script src="js/state.js?v=5"></script>
<script src="js/ui.js?v=5"></script>
<script src="js/thread-renderer.js?v=5"></script>
<script src="js/main.js?v=5"></script>

</body>
</html>
